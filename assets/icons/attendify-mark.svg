      <stop offset="0%" stop-color="#262840"/>
      <stop offset="100%" stop-color="#161726"/>
    </linearGradient>
    <linearGradient id="attPlum" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
