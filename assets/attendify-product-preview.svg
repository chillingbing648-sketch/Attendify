  <text x="340" y="151" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="1.5">TOTAL STUDENTS</text>
  <text x="340" y="181" font-family="Inter,system-ui,sans-serif" font-size="27" font-weight="900" fill="#111827">60</text>
  <text x="605" y="151" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="1.5">TODAY'S SESSIONS</text>
  <text x="605" y="181" font-family="Inter,system-ui,sans-serif" font-size="27" font-weight="900" fill="#111827">03</text>
  <text x="870" y="151" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="1.5">BATCH ATTENDANCE</text>
  <text x="870" y="181" font-family="Inter,system-ui,sans-serif" font-size="27" font-weight="900" fill="#059669">86.4%</text>
  <text x="1135" y="151" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="1.5">NEEDS ATTENTION</text>
  <text x="1135" y="181" font-family="Inter,system-ui,sans-serif" font-size="27" font-weight="900" fill="#DC2626">07</text>

  <!-- Sessions -->
  <text x="320" y="237" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="900" fill="#111827">Today's attendance</text>
  <text x="320" y="256" font-family="Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#64748B">Fast session access for the current academic schedule</text>

  <rect x="320" y="276" width="995" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="336" y="290" width="72" height="38" rx="8" fill="#EEF2FF"/>
  <text x="372" y="307" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="900" fill="#4338CA">LECTURE</text>
  <text x="372" y="321" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8.5" font-weight="800" fill="#6366F1">09:00</text>
  <text x="426" y="303" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="800" fill="#111827">Database Management Systems</text>
  <text x="426" y="320" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#64748B">Present 52 · Absent 6 · Late 2</text>
  <rect x="1197" y="292" width="100" height="32" rx="8" fill="#4F46E5"/>
  <text x="1247" y="312" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF">Edit session</text>

  <rect x="320" y="352" width="995" height="66" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="336" y="366" width="72" height="38" rx="8" fill="#ECFEFF"/>
  <text x="372" y="383" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="900" fill="#0F766E">PRACTICAL</text>
  <text x="372" y="397" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="8.5" font-weight="800" fill="#14B8A6">11:00</text>
  <text x="426" y="379" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="800" fill="#111827">Web Programming Lab</text>
  <text x="426" y="396" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#64748B">Present 55 · Absent 4 · Late 1</text>
  <rect x="1197" y="368" width="100" height="32" rx="8" fill="#0D9488"/>
  <text x="1247" y="388" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF">Open register</text>

  <!-- Register -->
  <g filter="url(#shadow)">
    <rect x="320" y="440" width="995" height="165" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="340" y="468" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="900" fill="#111827">60-student register</text>
  <text x="340" y="487" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#64748B">Search, review and mark attendance without leaving the session</text>
  <rect x="1020" y="454" width="125" height="29" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1037" y="472" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#94A3B8">Search roll / name</text>
  <rect x="1155" y="454" width="142" height="29" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="1172" y="472" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" fill="#4F46E5">Quick mark absent</text>

  <line x1="340" y1="500" x2="1297" y2="500" stroke="#E2E8F0"/>
  <text x="348" y="518" font-family="Inter,system-ui,sans-serif" font-size="8.5" font-weight="900" fill="#94A3B8">ROLL</text>
  <text x="410" y="518" font-family="Inter,system-ui,sans-serif" font-size="8.5" font-weight="900" fill="#94A3B8">STUDENT</text>
  <text x="1030" y="518" font-family="Inter,system-ui,sans-serif" font-size="8.5" font-weight="900" fill="#94A3B8">STATUS</text>
  <text x="1168" y="518" font-family="Inter,system-ui,sans-serif" font-size="8.5" font-weight="900" fill="#94A3B8">MARK</text>

  <g font-family="Inter,system-ui,sans-serif" font-size="9.5">
    <line x1="340" y1="534" x2="1297" y2="534" stroke="#F1F5F9"/>
    <text x="348" y="529" fill="#64748B">01</text><text x="410" y="529" fill="#111827" font-weight="700">Student 01</text>
    <rect x="1018" y="519" width="58" height="21" rx="10.5" fill="#ECFDF5"/><text x="1047" y="533" text-anchor="middle" fill="#047857" font-weight="800">Present</text>
    <rect x="1090" y="519" width="92" height="21" rx="10.5" fill="#ECFDF5"/><text x="1136" y="533" text-anchor="middle" fill="#047857" font-weight="800">Marked ✓</text>

    <line x1="340" y1="562" x2="1297" y2="562" stroke="#F1F5F9"/>
    <text x="348" y="557" fill="#64748B">02</text><text x="410" y="557" fill="#111827" font-weight="700">Student 02</text>
    <rect x="1018" y="547" width="58" height="21" rx="10.5" fill="#FEF2F2"/><text x="1047" y="561" text-anchor="middle" fill="#B91C1C" font-weight="800">Absent</text>
    <rect x="1090" y="547" width="92" height="21" rx="10.5" fill="#F8FAFC" stroke="#E2E8F0"/><text x="1136" y="561" text-anchor="middle" fill="#475569" font-weight="800">Undo</text>

    <line x1="340" y1="590" x2="1297" y2="590" stroke="#F1F5F9"/>
    <text x="348" y="585" fill="#64748B">03</text><text x="410" y="585" fill="#111827" font-weight="700">Student 03</text>
    <rect x="1018" y="575" width="58" height="21" rx="10.5" fill="#FFF7ED"/><text x="1047" y="589" text-anchor="middle" fill="#C2410C" font-weight="800">Late</text>
    <rect x="1090" y="575" width="92" height="21" rx="10.5" fill="#F8FAFC" stroke="#E2E8F0"/><text x="1136" y="589" text-anchor="middle" fill="#475569" font-weight="800">Review</text>
  </g>
</svg>