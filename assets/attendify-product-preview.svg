<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
  <title id="title">Attendify admin attendance dashboard preview</title>
  <desc id="desc">A polished visual representation of the Attendify dashboard with navigation, attendance metrics, today's sessions, and a 60-student register.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1500" height="680" rx="34" fill="url(#bg)"/>
  <rect x="55" y="45" width="1390" height="590" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>

  <!-- Sidebar -->
  <rect x="55" y="45" width="235" height="590" rx="24" fill="#FAFBFF"/>
  <path d="M290 65V615" stroke="#E2E8F0"/>
  <rect x="78" y="70" width="38" height="38" rx="11" fill="url(#accent)"/>
  <text x="97" y="95" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="900" fill="#fff">A</text>
  <text x="130" y="88" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="900" fill="#111827">Attendify</text>
  <text x="130" y="104" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#64748B">SY BSc IT · Admin</text>

  <text x="80" y="142" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="2">WORKSPACE</text>
  <rect x="70" y="154" width="205" height="38" rx="10" fill="#EEF2FF"/>
  <circle cx="92" cy="173" r="6" fill="#6366F1"/>
  <text x="108" y="177" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#4F46E5">Dashboard</text>
  <text x="90" y="216" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#475569">Mark Attendance</text>
  <text x="90" y="246" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#475569">Students</text>
  <text x="90" y="276" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#475569">Subjects</text>

  <text x="80" y="320" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="2">RECORDS</text>
  <text x="90" y="348" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#475569">History</text>
  <text x="90" y="378" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#475569">Reports</text>
  <text x="90" y="408" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#475569">Practical Reports</text>

  <text x="80" y="450" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="2">INSIGHTS</text>
  <text x="90" y="478" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#475569">Analytics</text>
  <text x="90" y="508" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#475569">Timetable</text>

  <line x1="80" y1="560" x2="260" y2="560" stroke="#E2E8F0"/>
  <text x="90" y="588" font-family="Inter,system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#475569">Settings &amp; Backup</text>

  <!-- Main topbar -->
  <text x="320" y="89" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#111827">Dashboard</text>
  <rect x="404" y="72" width="132" height="27" rx="13.5" fill="#F1F5F9"/>
  <circle cx="420" cy="85.5" r="4" fill="#10B981"/>
  <text x="431" y="89" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#475569">60 students</text>
  <rect x="1165" y="70" width="150" height="31" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="1182" y="90" font-family="Inter,system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#64748B">Search / command</text>
  <text x="1337" y="89" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#64748B">06 SEP 2026</text>

  <!-- KPI row -->
  <g filter="url(#shadow)">
    <rect x="320" y="125" width="245" height="78" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="585" y="125" width="245" height="78" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="850" y="125" width="245" height="78" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="1115" y="125" width="200" height="78" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
