<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Attendify — Student QR Check-In</title>
<meta name="description" content="Secure student attendance verification for SY BSc IT cohort.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface-subtle: #F0EDF7;
    --ink: #1C1F33;
    --ink-secondary: #4E526D;
    --ink-tertiary: #787D9C;
    --accent: #51458A;
    --accent-hover: #40356F;
    --safe: #178568;
    --safe-subtle: rgba(23, 133, 104, 0.12);
    --warn: #C28A25;
    --critical: #C94B50;
    --critical-subtle: rgba(201, 75, 80, 0.12);
    --border: #E7E4DE;
    --border-strong: #D5D1C7;
    --r-md: 10px;
    --r-lg: 14px;
    --shadow-md: 0 4px 14px rgba(32, 36, 58, 0.08);
  }

  [data-theme="dark"] {
    --bg: #141522;
    --surface: #1C1E30;
    --surface-subtle: #25283F;
    --ink: #F6F4FD;
    --ink-secondary: #B4B9D6;
    --ink-tertiary: #878CAE;
    --border: rgba(255, 255, 255, 0.09);
    --border-strong: rgba(255, 255, 255, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Quicksand', -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    line-height: 1.5;
  }

  .checkin-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    width: 100%;
    max-width: 440px;
    padding: 28px 24px;
    box-shadow: var(--shadow-md);
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .brand-logo { width: 34px; height: 34px; }
  .brand-title { font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
  .brand-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    background: var(--surface-subtle);
    color: var(--accent);
    border-radius: 4px;
    border: 1px solid rgba(81,69,138,0.2);
  }

  .session-info-strip {
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 13px;
  }

  .session-info-strip strong { color: var(--ink); }
  .session-info-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .session-info-row:last-child { margin-bottom: 0; }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  select, input {
    height: 44px;
    padding: 0 12px;
    border-radius: var(--r-md);
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  select:focus, input:focus {
    border-color: var(--accent);
  }

  .btn {
    width: 100%;
    height: 46px;
    background: var(--accent);
    color: #FFFFFF;
    border: none;
    border-radius: var(--r-md);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s ease, opacity 0.2s ease;
  }

  .btn:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .status-banner {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: var(--r-md);
    font-size: 13px;
    line-height: 1.4;
    display: none;
  }

  .status-banner.success {
    display: block;
    background: var(--safe-subtle);
    color: var(--safe);
    border: 1px solid rgba(23, 133, 104, 0.25);
  }

  .status-banner.error {
    display: block;
    background: var(--critical-subtle);
    color: var(--critical);
    border: 1px solid rgba(201, 75, 80, 0.25);
  }

  .status-banner.warn {
    display: block;
    background: rgba(194, 138, 37, 0.12);
    color: var(--warn);
    border: 1px solid rgba(194, 138, 37, 0.25);
  }

  .security-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-tertiary);
    margin-top: 18px;
  }

  .security-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--safe);
  }

  .authenticated-user-pill {
    background: var(--surface-subtle);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 10px 12px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="checkin-card">
  <div class="brand-header">
    <svg class="brand-logo" viewBox="0 0 64 64" fill="none">
      <rect x="2" y="2" width="60" height="60" rx="16" fill="#1C1D30"/>
      <path d="M19 47L29.5 17.2C30.4 14.6 33.6 14.6 34.5 17.2L45 47" stroke="#B8A9F8" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 35L29.5 41.5L46 22" stroke="#2CD5A4" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="14.5" r="2.2" fill="#FFFFFF"/>
    </svg>
    <span class="brand-title">Attendify</span>
    <span class="brand-badge">ACADEMIC QR</span>
  </div>

  <div class="session-info-strip" id="session-info">
    <div class="session-info-row">
      <span style="color:var(--ink-secondary);">Cohort:</span>
      <strong>SY BSc IT (60 Students)</strong>
    </div>
    <div class="session-info-row">
      <span style="color:var(--ink-secondary);">Session ID:</span>
      <strong id="session-id-display">Loading...</strong>
    </div>
    <div class="session-info-row">
      <span style="color:var(--ink-secondary);">Token Status:</span>
      <strong style="color:var(--safe);" id="token-status-display">Checking server...</strong>
    </div>
  </div>

  <div id="authenticated-view" style="display:none;">
    <div class="authenticated-user-pill">
      <div>
        <div style="font-size:11px; text-transform:uppercase; color:var(--ink-tertiary); font-weight:700;">Verified Student</div>
        <strong id="auth-student-name" style="color:var(--ink); font-size:14px;">Student Name</strong>
      </div>
      <button type="button" id="btn-switch-account" style="background:none; border:none; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer;">Switch</button>
    </div>
    <button type="button" class="btn" id="btn-submit-authenticated">
      <span>Confirm Attendance Check-In</span>
    </button>
  </div>

  <form id="checkin-form">
    <div class="form-group">
      <label for="student-select">Enrolled Student Identity</label>
      <select id="student-select" required>
        <option value="">— Choose your Roll No. & Name —</option>
      </select>
    </div>

    <div class="form-group">
      <label for="student-pin">Student Access PIN</label>
      <input type="password" id="student-pin" placeholder="Enter PIN (Default: 1000 + Roll No)" required autocomplete="current-password">
      <span style="font-size:11px; color:var(--ink-tertiary);">Identity verification requires your secret student PIN.</span>
    </div>

    <div class="form-group" style="flex-direction:row; align-items:center; gap:8px;">
      <input type="checkbox" id="remember-me" style="width:16px; height:16px; cursor:pointer;" checked>
      <label for="remember-me" style="font-size:12px; font-weight:500; cursor:pointer; color:var(--ink-secondary);">
        Remember me on this browser
      </label>
    </div>

    <button type="submit" class="btn" id="btn-submit">
      <span>Verify Identity &amp; Confirm Attendance</span>
    </button>
  </form>

  <div class="status-banner" id="status-banner"></div>

  <div class="security-indicator">
    <span class="security-dot"></span>
    <span>Zero-trust server validation &amp; database transactions</span>
  </div>
</div>

<script>
  // SY BSc IT 60 Enrolled Students list matching database & Storage.seedStudents()
  const ENROLLED_STUDENTS = [
    'Andre Harshad Balu','Ansari Farman Lukman','Behera Shubham Binod',
    'Chaurasiya Shivanshu Ashok','Chendvankar Tanishq Abhijit','Choursia Shraddha Madreshkumar',
    'Dudaye Shubham Pandurang','Gupta Himanshu Laxmikant','Gupta Nikhil Ganesh',
    'Gupta Raj Omprakash','Gurav Shreya Prakash','Jaiswal Khushi Dashrath',
    'Jaiswal Prince Dharmendra','Kottilaparambil Suvidh Sunil','Kushwaha Vinit Vidyanand',
    'Mishra Shashank Sureshkumar','Nesamoney Cinderella Jaiross','Pal Aryan Naveen',
    'Pal Ashish Ramavadh','Pal Laxmi Kapildev','Pandey Sharad Umeshchandra',
    'Rajput Prachi Narsing','Reddi Mahesh Chandranna','Sawant Narayan Manohar',
    'Sharma Abhay Chandrika','Sharma Kartike Sunil','Shevale Pratham Dryaneshwar',
    'Singh Aniket Rajesh','Singh Anurag Kush','Singh Aryan Sanjay',
    'Singh Bablu Kumar Santosh Kumar','Singh Janvi Anil','Singh Noel Damer',
    'Singh Sachi Ashutosh','Singh Sandhya Amarnath','Singh Vikash Kumar Laxman',
    'Yadav Pooja Om Prakash','Yadav Prince Virendrakumar','Yadav Vivek Rudra',
    'Yadav Yogank Ashok','Mishra Aditya Rajesh','Pardhe Harshit Chandrakant',
    'Jaiswal Moksh Rajkumar','Ghadigaonkar Maithili Mahesh','Pal Sanjana Rajendra',
    'Tiwari Pavan Awadesh','Thorat Kaustubh Ramesh','Makwana Ayushi Nilesh',
    'Dubey Harsh Puneet','Mourya Ansh Deenanath','Morye Mihir Mangesh',
    'Pandey Sakshi','Uttam Tripathi','Anchal Jaiswar',
    'Harshit Tiwari','Shivam Patel','Shivansu Mishra',
    'Abhay Yadav','Mahek Pandya','Abhishek Yadav'
  ].map((name, i) => ({ roll: i + 1, name }));

  const urlParams = new URLSearchParams(window.location.search);
  const sessionId = urlParams.get('s') || urlParams.get('session') || '';
  const token = urlParams.get('t') || urlParams.get('token') || '';

  const form = document.getElementById('checkin-form');
  const authView = document.getElementById('authenticated-view');
  const authStudentName = document.getElementById('auth-student-name');
  const btnSubmitAuth = document.getElementById('btn-submit-authenticated');
  const btnSwitch = document.getElementById('btn-switch-account');
  const select = document.getElementById('student-select');
  const pinInput = document.getElementById('student-pin');
  const banner = document.getElementById('status-banner');
  const sessionDisplay = document.getElementById('session-id-display');
  const tokenDisplay = document.getElementById('token-status-display');
  const submitBtn = document.getElementById('btn-submit');

  sessionDisplay.textContent = sessionId ? sessionId.slice(0, 18) + '...' : 'None';
  tokenDisplay.textContent = token ? 'Active Token Attached' : 'Missing Token';

  // Populate student list
  const savedRoll = localStorage.getItem('attendify:student_roll');
  ENROLLED_STUDENTS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.roll;
    opt.textContent = `Roll #${String(s.roll).padStart(2, '0')} — ${s.name}`;
    if (savedRoll && parseInt(savedRoll, 10) === s.roll) {
      opt.selected = true;
    }
    select.appendChild(opt);
  });

  // Check existing token
  let bearerToken = sessionStorage.getItem('attendify:student_token') || localStorage.getItem('attendify:student_token');
  let currentStudent = null;

  async function checkExistingAuth() {
    if (!bearerToken) return;
    try {
      const res = await fetch('/api/student/available-classes', {
        headers: { 'Authorization': `Bearer ${bearerToken}` }
      });
      if (res.ok) {
        // Authenticated! Find student from stored profile or roll
        const savedRollNum = parseInt(localStorage.getItem('attendify:student_roll'), 10);
        const stu = ENROLLED_STUDENTS.find(s => s.roll === savedRollNum);
        currentStudent = stu || { roll: savedRollNum || 1, name: 'Enrolled Student' };
        authStudentName.textContent = `Roll #${currentStudent.roll} — ${currentStudent.name}`;
        form.style.display = 'none';
        authView.style.display = 'block';
      } else {
        bearerToken = null;
        sessionStorage.removeItem('attendify:student_token');
        localStorage.removeItem('attendify:student_token');
      }
    } catch {}
  }

  checkExistingAuth();

  btnSwitch.addEventListener('click', () => {
    bearerToken = null;
    sessionStorage.removeItem('attendify:student_token');
    localStorage.removeItem('attendify:student_token');
    authView.style.display = 'none';
    form.style.display = 'block';
  });

  if (!sessionId || !token) {
    banner.className = 'status-banner error';
    banner.innerHTML = '<strong>No Active QR Session Detected:</strong><br>Please scan the live rotating QR code projected in class with your camera.';
    submitBtn.disabled = true;
    btnSubmitAuth.disabled = true;
  }

  // Handle Authenticated 1-Click Submission
  btnSubmitAuth.addEventListener('click', async () => {
    if (!sessionId || !token || !bearerToken) return;
    btnSubmitAuth.disabled = true;
    btnSubmitAuth.innerHTML = '<span>Verifying token with server...</span>';
    banner.style.display = 'none';

    try {
      const res = await fetch('/api/student/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${bearerToken}`
        },
        body: JSON.stringify({ sessionId, token })
      });
      const data = await res.json();
      if (data.success) {
        banner.className = 'status-banner success';
        banner.innerHTML = `<strong>✓ Check-In Confirmed &amp; Recorded!</strong><br>Your attendance has been cryptographically validated by the server.<br><span style="font-size:11px; opacity:0.85;">Timestamp: ${new Date(data.verifiedAt || Date.now()).toLocaleTimeString()}</span>`;
        btnSubmitAuth.innerHTML = '<span>✓ Attendance Confirmed</span>';
      } else {
        banner.className = 'status-banner error';
        banner.innerHTML = `<strong>Check-In Rejected:</strong><br>${data.message || data.error}`;
        btnSubmitAuth.disabled = false;
        btnSubmitAuth.innerHTML = '<span>Try Again</span>';
      }
    } catch (err) {
      banner.className = 'status-banner error';
      banner.innerHTML = '<strong>Attendance verification is temporarily unavailable.</strong><br>Please try again or check your campus network connection.';
      btnSubmitAuth.disabled = false;
      btnSubmitAuth.innerHTML = '<span>Try Again</span>';
    }
  });

  // Handle Form Submission with PIN
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const roll = parseInt(select.value, 10);
    const pin = pinInput.value.trim();
    if (!roll || !pin) return;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span>Authenticating identity...</span>';
    banner.style.display = 'none';

    try {
      // 1. Authenticate with server to obtain cryptographic bearer token
      const loginRes = await fetch('/api/student/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rollNumber: roll, pin })
      });
      const loginData = await loginRes.json();
      if (!loginData.success || !loginData.token) {
        banner.className = 'status-banner error';
        banner.innerHTML = `<strong>Authentication Failed:</strong><br>${loginData.message || 'Incorrect PIN for this roll number.'}`;
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Verify Identity &amp; Confirm Attendance</span>';
        return;
      }

      bearerToken = loginData.token;
      if (document.getElementById('remember-me').checked) {
        localStorage.setItem('attendify:student_token', bearerToken);
        localStorage.setItem('attendify:student_roll', String(roll));
      }
      sessionStorage.setItem('attendify:student_token', bearerToken);

      // 2. Submit attendance using authenticated server session
      submitBtn.innerHTML = '<span>Validating QR token...</span>';
      const submitRes = await fetch('/api/student/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${bearerToken}`
        },
        body: JSON.stringify({ sessionId, token })
      });

      const submitData = await submitRes.json();
      if (submitData.success) {
        banner.className = 'status-banner success';
        banner.innerHTML = `<strong>✓ Check-In Confirmed &amp; Recorded!</strong><br>Roll #${String(roll).padStart(2, '0')} (${loginData.student.name}) marked Present.<br><span style="font-size:11px; opacity:0.85;">Server Timestamp: ${new Date(submitData.verifiedAt || Date.now()).toLocaleTimeString()}</span>`;
        submitBtn.innerHTML = '<span>✓ Attendance Confirmed</span>';
      } else {
        banner.className = 'status-banner error';
        banner.innerHTML = `<strong>Check-In Rejected:</strong><br>${submitData.message || submitData.error}`;
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Try Again</span>';
      }
    } catch (err) {
      banner.className = 'status-banner error';
      banner.innerHTML = '<strong>Attendance verification is temporarily unavailable.</strong><br>Please try again or check server connectivity.';
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>Try Again</span>';
    }
  });
</script>

</body>
</html>
