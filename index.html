<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Attendify — SY BSc IT Attendance Portal</title>
<meta name="description" content="Admin attendance management system for 60 students of SY BSc IT batch.">
<meta name="theme-color" content="#4F46E5">

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">

<style>
  @media print {
    body { background: #FFFFFF !important; color: #000000 !important; }
    .sidebar, .topbar, .no-print, #toast-container { display: none !important; }
    .app-shell { display: block !important; height: auto !important; overflow: visible !important; }
    .app-main { display: block !important; overflow: visible !important; }
    .view-scroll { padding: 0 !important; overflow: visible !important; }
    .view { display: none !important; max-width: 100% !important; }
    .view.active { display: block !important; }
    .card { border: 1px solid #000000 !important; box-shadow: none !important; }
  }
</style>

<script>
  (function () {
    try {
      var raw = localStorage.getItem('attendify:v2');
      var theme = 'light';
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.settings && parsed.settings.theme) theme = parsed.settings.theme;
      }
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
</head>
<body>

<div id="app-root" class="app-shell"></div>

<noscript>
  <div style="padding:40px; font-family:sans-serif; max-width:480px; margin:0 auto; text-align:center;">
    <h1>JavaScript required</h1>
    <p>Attendify needs JavaScript enabled to manage attendance records.</p>
  </div>
</noscript>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/validation.js"></script>
<script src="js/state.js"></script>
<script src="js/attendance.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/mark-attendance.js"></script>
<script src="js/students.js"></script>
<script src="js/subjects.js"></script>
<script src="js/history.js"></script>
<script src="js/analytics.js"></script>
<script src="js/reports.js"></script>
<script src="js/practical-reports.js"></script>
<script src="js/timetable.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
